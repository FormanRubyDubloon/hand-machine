<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2EFE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2A1D15" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Collca</title>
    <!-- Link previews (WhatsApp, Messages, Slack, social): public/og-image.png is the splash emblem at 1200×630. -->
    <meta name="description" content="Know what's in the cupboard, cook from what you have, and shop for what's missing. On your computer, your phone and in Claude." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Collca" />
    <meta property="og:title" content="Collca" />
    <meta property="og:description" content="Know what's in the cupboard, cook from what you have, and shop for what's missing. On your computer, your phone and in Claude." />
    <meta property="og:url" content="https://shopping-list-app-db5118.netlify.app/prototypes/pantry-app/" />
    <meta property="og:image" content="https://shopping-list-app-db5118.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Collca emblem: COLLCA arched over a jar between two sprigs, with What you have, What to cook, What to buy." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Collca" />
    <meta name="twitter:description" content="Know what's in the cupboard, cook from what you have, and shop for what's missing. On your computer, your phone and in Claude." />
    <meta name="twitter:image" content="https://shopping-list-app-db5118.netlify.app/og-image.png" />
    <link rel="stylesheet" href="https://use.typekit.net/tvk6fub.css" />
    <!-- Light or dark and the colour theme, set before the page draws so it never flashes the wrong one.
         The same keys as src/theme.ts, which takes over once the app loads. -->
    <script>
      (function () {
        var root = document.documentElement, dark = false, thyme = false
        try {
          var t = localStorage.getItem("pantry.theme")
          dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
          var c = JSON.parse(localStorage.getItem("collca.colourTheme") || "null")
          thyme = !!c && c.theme === "thyme"
        } catch (e) {}
        if (new URLSearchParams(location.search).get("theme") !== "ds") root.classList.add("theme-warm")
        if (dark) root.classList.add("dark")
        if (thyme) root.classList.add("theme-thyme")
        root.style.colorScheme = dark ? "dark" : "light"
        root.style.background = thyme ? (dark ? "#344A31" : "#F2EDE0") : dark ? "#2A1D15" : "#F2EFE3"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
