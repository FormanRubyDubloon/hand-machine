<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1c1917}a:hover{color:#0c0a09}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; color: #0c0a09; font-family: 'stevie-sans', 'Figtree', sans-serif; overflow: hidden">
<main style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 24px 32px">
<span style="font-size: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Pantry</span>
<div style="display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-size: 34px; line-height: 1; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase">Sign in</h1>
<span style="font-size: 16px; line-height: 23px; color: #7c6d67">The same account as the pantry app. You only do this once on this phone.</span>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #7c6d67">Email</span><input type="email" placeholder="you@example.com" style="height: 52px; border: 0; border-bottom: 2px solid #1c1917; outline: none; background: transparent; font: inherit; font-size: 18px; color: #0c0a09"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" style="width: 100%; height: 56px; padding: 0 20px; box-sizing: border-box; background: #1c1917; border: 1px solid #1c1917; color: #fafaf9; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>Sign in with a passkey</button>
<button type="button" style="width: 100%; height: 56px; padding: 0 20px; box-sizing: border-box; background: #ffffff; border: 1px solid #1c1917; color: #0c0a09; font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px">Email me a sign-in link</button>
<span style="font-size: 13px; line-height: 18px; color: #7c6d67; text-align: center">You stay signed in, so the list still opens in a shop with no signal.</span>
</div>
</main>
</div>
</x-dc>
</body>
</html>
